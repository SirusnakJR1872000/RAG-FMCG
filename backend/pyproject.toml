[project]
name = "pharma-gmp-rag"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]   # S = security checks (flags pickle, asserts, etc.)
ignore = ["S101"]                          # allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"   # fresh event loop per test (isolation)
addopts = "-q"
